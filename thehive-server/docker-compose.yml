services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    environment:
      - http.host=0.0.0.0
      - discovery.type=single-node
      - cluster.name=hive
      - thread_pool.search.queue_size=100000
      - thread_pool.write.queue_size=10000
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data

  cassandra:
    image: cassandra:4
    environment:
      - CASSANDRA_CLUSTER_NAME=TheHive
    volumes:
      - cassandra_data:/var/lib/cassandra

  thehive:
    image: strangebee/thehive:5.3.4
    depends_on:
      - cassandra
      - elasticsearch
    ports:
      - "9000:9000"
    command:
      - --secret
      - "<YOUR_SECRET_KEY>"
      - --cql-hostnames
      - "cassandra"
      - --index-backend
      - "elasticsearch"
      - --es-hostnames
      - "elasticsearch"
    volumes:
      - thehive_data:/opt/thp/thehive/files

  cortex:
    image: thehiveproject/cortex:3.1.7
    depends_on:
      - elasticsearch
    environment:
      - job_directory=/tmp/cortex-jobs
    ports:
      - "9001:9001"
    command:
      - --secret
      - "<YOUR_SECRET_KEY>"
      - --es-hostname
      - "elasticsearch"

volumes:
  es_data:
  cassandra_data:
  thehive_data: